<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcade da casa — TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Rubik:wght@500;600;700;800;900&display=swap">
<link rel="stylesheet" href="/shared/ui.css">
</head>
<body>
<div id="lobby"></div>
<div id="tv">
  <div class="stage" id="stage"></div>
  <div class="side" id="side"></div>
</div>
<div id="tvl-over"></div>
<div class="conn" id="conn">conectando…</div>
<div id="turnover"></div>
<script src="/shared/client.js"></script>
<script src="/shared/tv-lobby.js"></script>
<script>
(() => {
  const A = ARCADE, $ = A.$, esc = A.esc;
  let mounted = null, activeView = null, lastScreen = null;
  A.tvLobby.mount($('#lobby'));

  // O palco (esquerda) pode ser fixo: o jogo monta uma vez com mount() e depois
  // só atualiza por dentro em after(). Sem mount(), o palco vem de html().stage.
  function render(c) {
    const impl = c.C.screen === 'game' ? A.games[c.C.gameId] : null;
    const nextView = impl && impl.tv;
    if (activeView !== nextView) {
      if (activeView && activeView.destroy) activeView.destroy();
      activeView = nextView;
      mounted = null;
    }
    // lobby (biblioteca) e jogo são raízes separadas: o lobby fica montado e só atualiza por dentro.
    document.body.dataset.screen = c.C.screen;
    if (c.C.screen === 'library') {
      mounted = null;
      if (lastScreen === 'game') A.tvLobby.backToLobby();
      lastScreen = 'library';
      A.tvLobby.update(c);
      return;
    }
    if (lastScreen === 'library') A.tvLobby.gameSelected(c);   // alguém escolheu no celular: a TV responde na hora
    lastScreen = 'game';
    if (!impl || !impl.tv) {
      mounted = null;
      $('#stage').innerHTML = '<div class="box center"><p class="sub">Carregando o jogo…</p></div>';
      $('#side').innerHTML = '';
      return;
    }
    const fixo = typeof impl.tv.mount === 'function';
    if (fixo && mounted !== c.C.gameId) { $('#stage').innerHTML = impl.tv.mount(c); mounted = c.C.gameId; }
    const out = impl.tv.html(c) || {};
    if (!fixo) $('#stage').innerHTML = out.stage || '';
    $('#side').innerHTML = out.side || '';
    if (impl.tv.after) impl.tv.after(c);
  }

  A.start('tv', render);
})();
</script>
</body>
</html>
