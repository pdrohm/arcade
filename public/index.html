<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arcade">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<title>Arcade da casa</title>
<link rel="stylesheet" href="/shared/ui.css">
<link rel="stylesheet" href="/qr-scan.css">
<script src="/pwa.js" defer></script>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="conn" id="conn">conectando…</div>
<div id="turnover"></div>
<script src="/qr-scan.js"></script>
<script src="/shared/kart/gamepad.js"></script>
<script src="/shared/client.js"></script>
<script>
'use strict';
(() => {
  const A = ARCADE, $ = A.$, esc = A.esc;
  const app = $('#app');
  let form = A.form(), pickTarget = null, ctx = null, selectedGameId = null, verQR = false;
  // Busca/filtro/ordenação da biblioteca (prateleira de jogos). Guardado em memória; filtro e
  // ordenação também vão pro localStorage (não a busca — cada visita começa sem texto digitado).
  let libSearch = '', libFilter = 'todos', libSort = 'padrao';
  try {
    const libPrefs = JSON.parse(localStorage.getItem('arcade_lib') || '{}');
    if (libPrefs.filter) libFilter = libPrefs.filter;
    if (libPrefs.sort) libSort = libPrefs.sort;
  } catch (e) { /* localStorage indisponível: segue com o padrão */ }
  function saveLibPrefs() {
    try { localStorage.setItem('arcade_lib', JSON.stringify({ filter: libFilter, sort: libSort })); } catch (e) {}
  }
  // Compara sem acento e sem diferenciar maiúsculas: "Voce" acha "Você".
  const normTxt = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

  // O browser só entrega a câmera em endereço seguro (https, localhost). No IP do Wi-Fi de casa
  // (http://192.168.x.x) ele nem cria navigator.mediaDevices. Lá o botão não teria como funcionar,
  // então some — e no lugar entra a dica do que resolve: a câmera do próprio celular abre o QR.
  const temQR = () => !!(window.QRSCAN && QRSCAN.disponivel());
  const btnQR = texto => temQR() ? `<button class="btn ghost" data-a="qr">📷 ${texto}</button>` : '';

  function header(c) {
    const me = c.you && c.C.players.find(p => p.pid === c.you.pid);
    const g = c.C.screen === 'game' ? c.game() : null;
    return `<div class="head">
      <div><h1>${g ? esc(g.emoji + ' ' + g.name) : '🕹️ Arcade'}</h1><p class="sub mut">${g ? 'Jogando agora' : 'Escolha um jogo'} · sala <b>${esc(c.room)}</b></p></div>
      ${me ? `<div class="center" data-a="rename"><span class="dot" style="background:${c.ci(me.color).hex};width:36px;height:36px"></span><div style="font-size:16px;font-weight:800">${esc(me.name)} ✏️</div></div>` : ''}
    </div>`;
  }

  // Sem código na URL (ou código que não existe): digite o código da TV ou crie uma sala.
  function lobby(c) {
    return `<div class="box"><h1>🕹️ Arcade da casa</h1><p class="sub mut" style="margin-top:6px">${c.noRoom ? `A sala <b>${esc(c.room)}</b> não existe mais.` : 'Digite o código que aparece na TV.'}</p></div>
      <div class="box"><p class="sub mut" style="margin-bottom:8px">Código da sala</p><input id="code" class="code" maxlength="4" placeholder="ABCD" autocapitalize="characters" autocomplete="off" spellcheck="false"></div>
      <button class="btn big ok" data-a="ir">Entrar na sala</button>
      ${temQR()
        ? '<button class="btn blue" data-a="qr">📷 Ler o QR code da TV</button>'
        : '<p class="sub center mut">Ou aponte a câmera normal do celular para o QR code da TV: ela abre a sala sozinha.</p>'}
      <p class="sub center mut">Sem TV por perto? Crie uma sala e passe o código para os outros.</p>
      <button class="btn ghost" data-a="criar">➕ Criar uma sala nova</button>`;
  }

  function entrar(c) {
    const taken = k => c.C.players.find(p => p.color === k);
    // A cor guardada neste celular pode ter ganho outro dono. Aí ela não vale mais:
    // nada fica marcado e "Entrar" só libera depois de escolher uma cor livre.
    if (form.color && taken(form.color)) { form.color = null; A.saveForm(form); }
    return `<div class="box"><h1>🕹️ Arcade da casa</h1><p class="sub mut" style="margin-top:6px">Sala <b>${esc(c.room)}</b> · Escolha sua cor. Ela é sua em todos os jogos.</p></div>
      <div class="box"><div class="colors">${c.meta.colors.map(col => {
        const t = taken(col.key);
        return `<div class="color ${form.color === col.key ? 'sel' : ''} ${col.dark ? 'dk' : ''}" style="background:${col.hex};opacity:${t ? .3 : 1}" ${t ? '' : `data-a="cor" data-c="${col.key}"`}>${col.name}<small style="font-size:12px;opacity:.85">${t ? esc(t.name) : ''}</small></div>`;
      }).join('')}</div></div>
      <div class="box"><p class="sub mut" style="margin-bottom:8px">Seu nome</p><input id="name" placeholder="Ex.: Pedro" maxlength="20" value="${esc(form.name)}"></div>
      <button class="btn big ok" data-a="entrar" ${form.color ? '' : 'disabled'}>Entrar na sala</button>
      <p class="sub center mut">Já jogou antes? Entre com o mesmo nome para voltar ao seu lugar.</p>
      ${btnQR('Ler o QR code de outra TV')}
      <div class="box">${c.playersHtml()}</div>`;
  }

  function biblioteca(c) {
    const n = c.C.players.length;
    const selected = c.meta.games.find(g => g.id === selectedGameId);
    if (selected) return detalhes(c, selected);

    const chips = [['todos', 'Todos'], ['cabem', 'Cabem agora'], ['dupla', 'Dá para 2'], ['grupo', 'Só em grupo (3+)']];
    const sorts = [['padrao', 'Padrão'], ['az', 'A–Z'], ['jogadores', 'Nº de jogadores']];
    return `${qrSala(c)}
      <div class="box lib-tools">
        <input id="lib-search" class="lib-search" type="search" inputmode="search" placeholder="🔎 Buscar jogo…" value="${esc(libSearch)}" autocomplete="off" autocapitalize="off" spellcheck="false">
        <div class="lib-chips">${chips.map(([k, label]) => `<button class="lib-chip ${libFilter === k ? 'sel' : ''}" data-a="lib-filtro" data-k="${k}">${esc(label)}</button>`).join('')}</div>
        <div class="lib-sort"><span class="sub mut">Ordenar:</span>${sorts.map(([k, label]) => `<button class="lib-chip ${libSort === k ? 'sel' : ''}" data-a="lib-sort" data-k="${k}">${esc(label)}</button>`).join('')}</div>
      </div>
      <div id="lib-results">${libResults(c)}</div>
      <div class="box">${c.playersHtml()}</div>
      ${c.C.event ? `<p class="sub center">${c.hl(c.C.event.text)}</p>` : ''}
      <button class="btn ghost" data-a="rename">✏️ Mudar meu nome</button>
      <button class="btn ghost" data-a="sair">Trocar de cor / sair da sala</button>
      <button class="btn ghost" data-a="trocar">🚪 Ir para outra sala</button>
      ${btnQR('Ler o QR code de outra TV')}`;
  }

  // QR da sala no próprio celular: quem chega aponta a câmera para a tela de quem já está dentro.
  // O servidor já manda o SVG pronto (o mesmo da TV) em meta.nets.
  function qrSala(c) {
    if (!verQR) return `<button class="btn blue" data-a="ver-qr">📲 Chamar mais gente (QR da sala)</button>`;
    const nets = (c.meta.nets || []).filter(x => x.qr);
    return `<div class="box center phone-qr">
        <div class="phone-qr-list">${nets.map(x => `<div class="phone-qr-item">${x.qr}${nets.length > 1 ? `<p class="sub">${esc(x.label)}</p>` : ''}</div>`).join('')}</div>
        <p class="sub">${nets.length ? 'Aponte a câmera de outro celular para cá.' : ''} Ou digite o código <b class="phone-qr-code">${esc(c.room)}</b></p>
        <button class="btn ghost" data-a="ver-qr">Esconder o QR</button>
      </div>`;
  }

  // Contagem + prateleira filtrada. Separado da caixa de busca: digitar só troca isto aqui,
  // o campo de texto nunca é recriado (o teclado e a sugestão do Android não se perdem).
  function libResults(c) {
    const n = c.C.players.length;
    const q = normTxt(libSearch.trim());
    let list = c.meta.games.filter(g => {
      if (q) {
        const howTo = Array.isArray(g.howTo) ? g.howTo.join(' ') : '';
        const hay = normTxt([g.name, g.tagline || '', howTo].join(' '));
        if (!hay.includes(q)) return false;
      }
      const min = g.minPlayers || 2, max = g.maxPlayers || 8;
      const maxEfetivo = g.spectators ? Infinity : max;   // com torcida: quem sobra assiste
      if (libFilter === 'cabem' && !(n >= min && n <= maxEfetivo)) return false;
      if (libFilter === 'dupla' && !(min <= 2 && max >= 2)) return false;
      if (libFilter === 'grupo' && !(min >= 3)) return false;
      return true;
    });
    if (libSort === 'az') list = [...list].sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
    else if (libSort === 'jogadores') list = [...list].sort((a, b) => (a.minPlayers || 2) - (b.minPlayers || 2) || (a.maxPlayers || 8) - (b.maxPlayers || 8));

    return `<p class="sub mut lib-count">${list.length} ${list.length === 1 ? 'jogo' : 'jogos'}</p>
      ${list.length ? `<div class="shelf">${list.map(g => {
        const off = n < (g.minPlayers || 2);
        return `<div class="card ${off ? 'off' : ''}" data-a="detalhes" data-id="${g.id}">
          <div class="art" style="background:${g.art || 'linear-gradient(135deg,#334155,#0f172a)'}"></div>
          <div class="emoji">${g.emoji || '🎲'}</div>
          <div class="t">${esc(g.name)}</div><div class="d">${esc(g.tagline || '')}</div>
          <div class="n">${off ? `Precisa de ${g.minPlayers} jogadores (tem ${n})` : `${g.minPlayers}–${g.maxPlayers} jogadores · toque para começar`}</div>
        </div>`;
      }).join('')}</div>` : `<div class="box lib-empty"><p class="sub center mut">Nenhum jogo encontrado com esses filtros.</p><button class="btn ghost" data-a="lib-limpar">Limpar busca e filtros</button></div>`}`;
  }

  function detalhes(c, g) {
    const n = c.C.players.length, min = g.minPlayers || 2, max = g.maxPlayers || 8;
    const falta = Math.max(0, min - n), cheio = n > max, podeComecar = !falta && !cheio;
    const regras = Array.isArray(g.howTo) ? g.howTo : [];
    const status = cheio ? `Este jogo aceita até ${max} jogadores.` : falta ? `Faltam ${falta} ${falta === 1 ? 'jogador' : 'jogadores'} para começar.` : `${n} jogadores prontos para jogar.`;
    return `<div class="game-detail">
      <div class="game-detail-hero" style="background:${g.art || 'linear-gradient(135deg,#334155,#0f172a)'}">
        <div class="game-detail-emoji">${g.emoji || '🎲'}</div>
        <h1>${esc(g.name)}</h1>
        <p>${esc(g.tagline || '')}</p>
      </div>
      <div class="box game-detail-info">
        <div class="game-detail-status ${podeComecar ? 'ready' : ''}">${esc(status)}</div>
        <p class="sub mut">De ${min} a ${max} jogadores</p>
      </div>
      <div class="box game-rules">
        <h2>Como funciona</h2>
        ${regras.length ? `<ol>${regras.map(rule => `<li>${esc(rule)}</li>`).join('')}</ol>` : '<p class="sub">As regras aparecem quando o jogo começar.</p>'}
      </div>
      <button class="btn big ${podeComecar ? 'ok' : ''}" data-a="jogar" data-id="${esc(g.id)}" ${podeComecar ? '' : 'disabled'}>${podeComecar ? '▶️ Iniciar' : '🔒 Iniciar'}</button>
      <button class="btn ghost" data-a="voltar-jogos">⬅️ Voltar aos jogos</button>
    </div>`;
  }

  let lastKey = null, activeView = null, lastScreen = null;
  function render(c) {
    ctx = c;
    const screen = c.C && c.C.screen;
    if (lastScreen === 'game' && screen === 'library') selectedGameId = null;
    lastScreen = screen;
    const nextView = c.S && c.C && c.you && screen === 'game' && A.games[c.C.gameId] ? A.games[c.C.gameId].phone : null;
    if (activeView !== nextView) {
      if (activeView && activeView.destroy) activeView.destroy();
      activeView = nextView;
      lastKey = null;
    }
    if (!c.S || !c.C) {              // sem sala ainda: só a tela de código
      lastKey = null;
      app.innerHTML = lobby(c);
      app.querySelectorAll('[data-a]').forEach(el => el.onclick = ev => { ev.stopPropagation(); act(el.dataset.a, el); });
      const code = $('#code'); code.focus(); code.onkeydown = ev => { if (ev.key === 'Enter') act('ir'); };
      return;
    }
    // Um jogo pode pedir para NÃO redesenhar a tela (ex.: quadro de desenho no meio do rabisco).
    // Se a chave for a mesma da última vez, só chama after() para atualizar por dentro.
    const implK = screen === 'game' ? A.games[c.C.gameId] : null;
    const key = implK && implK.phone && implK.phone.key ? c.C.screen + ':' + c.C.gameId + ':' + implK.phone.key(c) : null;
    if (key !== null && key === lastKey && c.you) { if (implK.phone.after) implK.phone.after(c); return; }
    lastKey = key;
    let h = '';
    if (!c.you) h = entrar(c);
    else if (c.C.screen === 'library') h = header(c) + biblioteca(c);
    else {
      const impl = A.games[c.C.gameId];
      h = header(c) + (impl && impl.phone ? impl.phone.html(c) : '<div class="box center"><p class="sub">Carregando o jogo…</p></div>')
        + `<button class="btn ghost" data-a="voltar">⬅️ Sair do jogo (volta para a biblioteca)</button>`;
    }
    // O innerHTML inteiro é trocado a cada estado do servidor. Se o campo de busca da biblioteca
    // estiver focado, guardamos o cursor antes de trocar o HTML e devolvemos o foco depois —
    // senão a pessoa digitaria uma letra e o teclado fecharia sozinho a cada atualização.
    const buscaFocada = document.activeElement && document.activeElement.id === 'lib-search';
    const buscaSel = buscaFocada ? [document.activeElement.selectionStart, document.activeElement.selectionEnd] : null;
    app.innerHTML = h;
    app.querySelectorAll('[data-a]').forEach(el => el.onclick = ev => { ev.stopPropagation(); act(el.dataset.a, el); });
    const n = $('#name'); if (n) n.oninput = () => { form.name = n.value; };
    const buscaEl = $('#lib-search');
    if (buscaEl) {
      buscaEl.oninput = () => {
        libSearch = buscaEl.value;
        const res = $('#lib-results'); if (!res) return;
        res.innerHTML = libResults(ctx);
        res.querySelectorAll('[data-a]').forEach(el => el.onclick = ev => { ev.stopPropagation(); act(el.dataset.a, el); });
      };
      if (buscaFocada) {
        buscaEl.focus();
        if (buscaSel) buscaEl.setSelectionRange(buscaSel[0], buscaSel[1]);
      }
    }
    const impl = c.C.screen === 'game' ? A.games[c.C.gameId] : null;
    if (impl && impl.phone && impl.phone.after) impl.phone.after(c);
  }

  function act(a, el) {
    const c = ctx;
    // ações da tela de entrada e da prateleira só valem lá; dentro de um jogo, o jogo é quem trata (evita colisão de nomes)
    const emJogo = c.S && c.you && c.C.screen === 'game';
    switch (emJogo && ['cor', 'entrar', 'detalhes', 'jogar', 'ir', 'criar'].includes(a) ? '' : a) {
      case 'ir': { const v = ($('#code').value || '').trim().toUpperCase(); if (v.length !== 4) return A.toast('O código tem 4 letras.'); return A.goRoom(v); }
      case 'criar': return A.createRoom();
      // A câmera lê o QR da TV e o código de 4 letras sai do endereço. Trocamos só o código:
      // ficamos no mesmo endereço deste celular (mudar de endereço perderia o lugar guardado).
      case 'qr': {
        if (!window.QRSCAN) return A.toast('O leitor de QR não carregou. Digite o código.');
        return QRSCAN.open(code => { if (code === A.room) return A.toast('Você já está nesta sala.'); A.goRoom(code); });
      }
      case 'trocar': if (confirm('Ir para outra sala? Seu lugar nesta sala fica guardado.')) location.href = '/'; return;
      case 'cor': form.color = el.dataset.c; A.saveForm(form); render(c); return;
      case 'entrar': {
        const before = A.form().name;
        if (before && before !== form.name) A.setPrev(before);
        A.saveForm(form);
        return A.send({ t: 'join', room: A.room, color: form.color, name: form.name, pid: A.identity(), prevName: localStorage.getItem('arcade_prev') || '', sid: A.sid() });
      }
      case 'rename': {
        const n = prompt('Seu nome:', c.you ? c.you.name : form.name);
        if (n && n.trim()) { A.setPrev(form.name); form.name = n.trim().slice(0, 20); A.saveForm(form); A.send({ t: 'rename', name: form.name }); }
        return;
      }
      case 'sair': if (confirm('Sair da sala? Você perde seu lugar na ordem.')) { A.send({ t: 'leave' }); form.color = null; A.saveForm(form); } return;
      case 'kick': if (confirm(`Tirar "${el.dataset.name}" da sala? Só faça isso se esse celular não vai voltar.`)) A.send({ t: 'kick', pid: el.dataset.pid }); return;
      case 'lib-filtro': libFilter = el.dataset.k; saveLibPrefs(); return render(c);
      case 'lib-sort': libSort = el.dataset.k; saveLibPrefs(); return render(c);
      case 'lib-limpar': libSearch = ''; libFilter = 'todos'; libSort = 'padrao'; saveLibPrefs(); return render(c);
      case 'ver-qr': verQR = !verQR; return render(c);
      case 'detalhes': selectedGameId = el.dataset.id; return render(c);
      case 'voltar-jogos': selectedGameId = null; return render(c);
      case 'jogar': return A.send({ t: 'play', id: el.dataset.id });
      case 'voltar': if (confirm('Sair do jogo e voltar para a biblioteca? A partida atual acaba.')) { selectedGameId = null; A.send({ t: 'quit' }); } return;
    }
    const impl = A.games[c.C.gameId];
    if (impl && impl.phone && impl.phone.act) impl.phone.act(a, el, c);
  }

  A.start('phone', render);
})();
</script>
</body>
</html>
