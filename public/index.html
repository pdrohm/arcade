<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arcade">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<title>Arcade da casa</title>
<link rel="stylesheet" href="/shared/ui.css">
<link rel="stylesheet" href="/shared/shell.css">
<link rel="stylesheet" href="/qr-scan.css">
<script src="/pwa.js" defer></script>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="conn" id="conn">conectando…</div>
<div id="turnover"></div>
<script src="/qr-scan.js"></script>
<script src="/shared/kart/gamepad.js"></script>
<script src="/shared/client.js"></script>
<script src="/shared/avatar.js"></script>
<script>
'use strict';
(() => {
  const A = ARCADE, $ = A.$, esc = A.esc;
  const app = $('#app');
  let form = A.form(), pickTarget = null, ctx = null, selectedGameId = null, verQR = false, editAv = false, nameDraft = '';
  // Boneco: quem nunca montou ganha um sorteado (dá para trocar nas setas).
  if (!Array.isArray(form.av) && A.avatar) { form.av = A.avatar.random(); A.saveForm(form); }
  // Busca/filtro/ordenação da biblioteca (prateleira de jogos). Guardado em memória; filtro e
  // ordenação também vão pro localStorage (não a busca — cada visita começa sem texto digitado).
  let libSearch = '', libFilter = 'todos', libSort = 'padrao', libCat = '';
  try {
    const libPrefs = JSON.parse(localStorage.getItem('arcade_lib') || '{}');
    if (libPrefs.filter) libFilter = libPrefs.filter;
    if (libPrefs.sort) libSort = libPrefs.sort;
    if (libPrefs.cat) libCat = libPrefs.cat;
  } catch (e) { /* localStorage indisponível: segue com o padrão */ }
  function saveLibPrefs() {
    try { localStorage.setItem('arcade_lib', JSON.stringify({ filter: libFilter, sort: libSort, cat: libCat })); } catch (e) {}
  }
  // Compara sem acento e sem diferenciar maiúsculas: "Voce" acha "Você".
  const normTxt = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

  // O browser só entrega a câmera em endereço seguro (https, localhost). No IP do Wi-Fi de casa
  // (http://192.168.x.x) ele nem cria navigator.mediaDevices. Lá o botão não teria como funcionar,
  // então some — e no lugar entra a dica do que resolve: a câmera do próprio celular abre o QR.
  const temQR = () => !!(window.QRSCAN && QRSCAN.disponivel());
  const btnQR = texto => temQR() ? `<button class="btn ghost" data-a="qr">${texto}</button>` : '';

  // Categorias dos jogos (meta.category). A cor da categoria é a cor do jogo na casca toda.
  const CATS = [['desenho', 'Desenho', '#b08cff'], ['palavras', 'Palavras', '#3db4f2'], ['cartas', 'Cartas', '#f0443a'], ['festa', 'Festa', '#ff7ab8'], ['acao', 'Ação', '#35d07f'], ['videogame', 'Videogame', '#ff9a3c']];
  const catOf = g => CATS.find(k => k[0] === g.category) || CATS[4];
  const pad2 = n => (n < 10 ? '0' : '') + n;
  const minOf = g => g.minPlayers || 2, maxOf = g => g.maxPlayers || 8;
  // Cabe agora: tem gente suficiente e não passa do máximo (com torcida, quem sobra assiste).
  const cabe = (g, n) => n >= minOf(g) && (g.spectators || n <= maxOf(g));
  const pessoas = n => `${n} ${n === 1 ? 'pessoa' : 'pessoas'}`;
  const LOGO = '<div class="logo pix" aria-label="Arcade da casa">ARCADE<br><span>DA CASA</span></div>';
  const ICO_BUSCA = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0f0f14" stroke-width="2.5" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>';
  const ICO_DADO = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0f0f14" stroke-width="2.5" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="1.4" fill="#0f0f14"/><circle cx="16" cy="16" r="1.4" fill="#0f0f14"/><circle cx="12" cy="12" r="1.4" fill="#0f0f14"/></svg>';
  const ICO_PLAY = '<svg width="20" height="22" viewBox="0 0 20 22" aria-hidden="true"><path d="M2 1l17 10L2 21z" fill="#0f0f14"/></svg>';
  const ICO_VOLTAR = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f1f0ea" stroke-width="3" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';

  // Barra preta do topo. Na biblioteca: logo, sala e o seu boneco. No detalhe: voltar + categoria.
  // Dentro do jogo: a capa do jogo (cor + glifo) e o nome no lugar do logo.
  function header(c, modo) {
    const salaChip = c.room ? `<div class="room-chip mono" data-copy="${esc(c.room)}">SALA <span class="pix">${esc(c.room)}</span></div>` : '';
    if (!c.you) return `<header class="topbar">${LOGO}</header>`;
    const me = c.C.players.find(p => p.pid === c.you.pid);
    const g = c.C.screen === 'game' ? c.game() : null;
    const perfil = me ? `<button class="me-btn" data-a="${g ? 'rename' : 'perfil'}" aria-label="Seu perfil: ${esc(me.name)}" style="background:${c.ci(me.color).hex}">${A.avatar ? A.avatar.svg(me.av, c.ci(me.color).hex, 36) : esc(me.name.slice(0, 1).toUpperCase())}</button>` : '';
    if (modo && modo.detalhe) {
      return `<header class="topbar"><button class="back-btn" data-a="voltar-jogos" aria-label="Voltar aos jogos">${ICO_VOLTAR}</button>
        <span class="mono topbar-cat">${esc(catOf(modo.detalhe)[1].toUpperCase())}</span><div class="grow"></div>${salaChip}</header>`;
    }
    if (g) {
      const k = catOf(g);
      return `<header class="topbar"><span class="game-chip pix dots" style="background-color:${k[2]}">${esc(g.glyph || '?')}</span>
        <span class="topbar-game"><span class="mono">JOGANDO</span><b>${esc(g.name)}</b></span>${salaChip}${perfil}</header>`;
    }
    return `<header class="topbar">${LOGO}<div class="grow"></div>${salaChip}${perfil}</header>`;
  }

  // Sem código na URL (ou código que não existe): digite o código da TV ou crie uma sala.
  function lobby(c) {
    return `<header class="topbar">${LOGO}</header>
      <h1 class="disp page-title">Entrar<br>numa sala</h1>
      ${c.noRoom ? `<div class="box warn"><b>A sala <span class="pix">${esc(c.room)}</span> não existe mais.</b> Digite o código que está na TV agora.</div>` : '<p class="lead">Digite o código de 4 letras que aparece na TV.</p>'}
      <label class="code-block dots"><span class="mono">CÓDIGO DA SALA</span>
        <input id="code" class="code pix" maxlength="4" placeholder="ABCD" autocapitalize="characters" autocomplete="off" spellcheck="false"></label>
      <button class="btn big dark" data-a="ir">Entrar</button>
      ${temQR()
        ? '<button class="btn blue" data-a="qr">Ler o QR code da TV</button>'
        : '<p class="sub center mut">Ou aponte a câmera normal do celular para o QR code da TV: ela abre a sala sozinha.</p>'}
      <div class="divider mono"><span>SEM TV POR PERTO?</span></div>
      <p class="sub center mut">Crie uma sala e passe o código para os outros.</p>
      <button class="btn" data-a="criar">Criar uma sala nova</button>`;
  }

  // Editor do boneco: o boneco num quadrado da sua cor e, ao lado, setas para olhos, boca e enfeite.
  // comNome: dentro da sala, o editor do boneco também troca o nome (vale no "Pronto" ou no Enter).
  const AV_PX = 84;
  function avatarBox(c, comNome) {
    if (!A.avatar) return '';
    const col = form.color ? c.ci(form.color).hex : '#94a3b8';
    const rows = A.avatar.NAMES.map((n, i) => `<div class="av-row">
        <button class="av-arrow" data-a="av-prev" data-i="${i}" aria-label="Voltar ${n.toLowerCase()}">‹</button>
        <span class="mono">${esc(n.toUpperCase())}</span>
        <button class="av-arrow" data-a="av-next" data-i="${i}" aria-label="Mudar ${n.toLowerCase()}">›</button></div>`).join('');
    return `<div class="av-edit2${comNome ? ' box' : ''}" id="av-edit">
        <div class="av-face2" id="av-face" style="background:${col}">${A.avatar.svg(form.av, col, AV_PX)}</div>
        <div class="av-rows">${rows}<button class="av-rand mono" data-a="av-rand">${ICO_DADO} SORTEAR</button></div>
        ${comNome ? `<label class="field"><span class="mono">SEU NOME</span><input id="av-name" placeholder="Ex.: Pedro" maxlength="20" enterkeyhint="done" value="${esc(nameDraft)}"></label>` : ''}
      </div>`;
  }
  function avatarStep(i, d) {
    const av = A.avatar.clean(form.av, '');
    if (i < 0) form.av = A.avatar.random();
    else { av[i] = (av[i] + d + A.avatar.N[i]) % A.avatar.N[i]; form.av = av; }
    A.saveForm(form);
    if (ctx && ctx.you) A.send({ t: 'avatar', av: form.av });   // já está na sala: troca na hora para todo mundo
    const face = $('#av-face');
    if (face) face.innerHTML = A.avatar.svg(form.av, form.color && ctx ? ctx.ci(form.color).hex : '#94a3b8', AV_PX);
  }

  function entrar(c) {
    const taken = k => c.C.players.find(p => p.color === k);
    // A cor guardada neste celular pode ter ganho outro dono. Aí ela não vale mais:
    // nada fica marcado e "Entrar" só libera depois de escolher uma cor livre.
    if (form.color && taken(form.color)) { form.color = null; A.saveForm(form); }
    const n = c.C.players.length;
    const mine = form.color ? c.ci(form.color).hex : '#ffce1f';
    return `${header(c)}
      <div class="room-block dots">
        <div><div class="mono room-lbl">VOCÊ ESTÁ ENTRANDO NA SALA</div><div class="pix room-code">${esc(c.room)}</div></div>
        <div class="mono room-count">${n ? `${pessoas(n).toUpperCase()}<br>JÁ ${n === 1 ? 'ESTÁ' : 'ESTÃO'} AQUI` : 'SALA VAZIA:<br>VOCÊ É O 1º'}</div>
      </div>
      <h1 class="disp page-title">Quem é<br>você?</h1>
      ${avatarBox(c)}
      <label class="field"><span class="mono">SEU NOME</span><input id="name" placeholder="Ex.: Pedro" maxlength="20" value="${esc(form.name)}"></label>
      <div class="field"><span class="mono">SUA COR (VALE EM TODOS OS JOGOS)</span>
        <div class="colors2">${c.meta.colors.map(col => {
          const t = taken(col.key), sel = form.color === col.key;
          return `<button class="color2 ${sel ? 'sel' : ''} ${t ? 'taken' : ''}" style="background:${col.hex}" ${t ? 'disabled' : `data-a="cor" data-c="${col.key}"`} aria-label="${esc(col.name)}${t ? ` (já é de ${esc(t.name)})` : sel ? ' (escolhida)' : ''}">${t ? '×' : sel ? '✓' : ''}</button>`;
        }).join('')}</div></div>
      <button class="btn big dark enter-btn" data-a="entrar" style="box-shadow:6px 6px 0 ${mine}" ${form.color ? '' : 'disabled'}>Entrar</button>
      <p class="sub center mut">${form.color ? 'Já jogou antes? Entre com o mesmo nome para voltar ao seu lugar.' : 'Escolha uma cor livre para entrar.'}</p>
      ${btnQR('Ler o QR code de outra TV')}
      ${n ? `<div class="sec-head"><span class="tag">Na sala</span><span class="mono mut">${pessoas(n).toUpperCase()}</span></div>${c.playersHtml()}` : ''}`;
  }

  function biblioteca(c) {
    const n = c.C.players.length;
    const selected = c.meta.games.find(g => g.id === selectedGameId);
    if (selected) return detalhes(c, selected);
    const games = c.meta.games;
    return `${header(c)}
      <section class="lib-top">
        <h1 class="disp page-title">Escolha<br>um jogo</h1>
        <p class="lead">${games.length} jogos · ${pessoas(n)} na sala</p>
        <div class="lib-search-row">
          <label class="lib-search-box">${ICO_BUSCA}<input id="lib-search" class="lib-search" type="search" inputmode="search" placeholder="Buscar jogo" aria-label="Buscar jogo" value="${esc(libSearch)}" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
          <button class="surprise-btn" data-a="surpresa">${ICO_DADO}Surpresa</button>
        </div>
      </section>
      <section class="cats">${CATS.map(([k, label, hex]) => {
        const qtd = games.filter(g => catOf(g)[0] === k).length;
        const on = libCat === k;
        return `<button class="cat dots ${on ? 'sel' : ''} ${libCat && !on ? 'dim' : ''}" style="background-color:${hex}" data-a="lib-cat" data-k="${k}" aria-pressed="${on}">
          <span class="disp cat-name">${esc(label)}${on ? '<small class="mono">TOQUE PARA VER TODOS</small>' : ''}</span>
          <span class="cat-num"><span class="pix">${pad2(qtd)}</span><span class="mono">JOGOS</span></span></button>`;
      }).join('')}</section>
      <div id="lib-results">${libResults(c)}</div>
      ${qrSala(c)}
      <div class="sec-head"><span class="tag">Na sala</span><span class="mono mut">${pessoas(n).toUpperCase()}</span></div>
      ${c.playersHtml()}
      ${c.C.event ? `<p class="sub center">${c.hl(c.C.event.text)}</p>` : ''}
      ${editAv ? avatarBox(c, true) : ''}
      <button class="btn ${editAv ? 'ok' : ''}" data-a="av-edit">${editAv ? 'Pronto' : 'Mudar meu boneco e nome'}</button>
      <button class="btn ghost" data-a="rename">Mudar só o nome</button>
      <button class="btn ghost" data-a="sair">Trocar de cor / sair da sala</button>
      <button class="btn ghost" data-a="trocar">Ir para outra sala</button>
      ${btnQR('Ler o QR code de outra TV')}`;
  }

  // QR da sala no próprio celular: quem chega aponta a câmera para a tela de quem já está dentro.
  // O servidor já manda o SVG pronto (o mesmo da TV) em meta.nets.
  function qrSala(c) {
    if (!verQR) return `<button class="btn blue" data-a="ver-qr">Chamar mais gente (QR da sala)</button>`;
    const nets = (c.meta.nets || []).filter(x => x.qr);
    return `<div class="box center phone-qr">
        <div class="phone-qr-list">${nets.map(x => `<div class="phone-qr-item">${x.qr}${nets.length > 1 ? `<p class="mono">${esc(x.label)}</p>` : ''}</div>`).join('')}</div>
        <p class="sub">${nets.length ? 'Aponte a câmera de outro celular para cá.' : ''} Ou digite o código</p>
        <div class="pix phone-qr-code" data-copy="${esc(c.room)}">${esc(c.room)}</div>
        <button class="btn blue" data-copy="${esc(location.origin + '/' + c.room)}">Copiar o link da sala</button>
        <button class="btn" data-a="ver-qr">Esconder o QR</button>
      </div>`;
  }

  // Cartão de jogo: capa na cor da categoria com o glifo em pixel, nome e faixa de jogadores.
  function gameCard(g, n, mini) {
    const k = catOf(g), min = minOf(g), max = maxOf(g);
    const falta = n < min ? min - n : 0, cheio = !g.spectators && n > max;
    const aviso = falta ? `FALTA${falta > 1 ? 'M' : ''} ${falta}` : cheio ? `ATÉ ${max}` : '';
    return `<button class="gcard ${mini ? 'mini' : ''} ${aviso ? 'off' : ''}" data-a="detalhes" data-id="${esc(g.id)}" aria-label="${esc(g.name)}, ${min} a ${max} jogadores">
        <span class="gcover dots pix" style="background-color:${k[2]}">${esc(g.glyph || '?')}${aviso ? `<span class="gwarn mono">${aviso}</span>` : ''}</span>
        <span class="gbody"><span class="gname">${esc(g.name)}</span>
          <span class="gmeta mono"><span class="gsq" style="background:${k[2]}"></span>${min === max ? min : `${min} A ${max}`}</span></span>
      </button>`;
  }

  // Contagem + prateleira filtrada. Separado da caixa de busca: digitar só troca isto aqui,
  // o campo de texto nunca é recriado (o teclado e a sugestão do Android não se perdem).
  function libResults(c) {
    const n = c.C.players.length;
    const q = normTxt(libSearch.trim());
    const daCat = libCat ? c.meta.games.filter(g => catOf(g)[0] === libCat) : c.meta.games;
    let list = daCat.filter(g => {
      if (q) {
        const howTo = Array.isArray(g.howTo) ? g.howTo.join(' ') : '';
        const hay = normTxt([g.name, g.tagline || '', howTo].join(' '));
        if (!hay.includes(q)) return false;
      }
      const min = minOf(g), max = maxOf(g);
      if (libFilter === 'cabem' && !cabe(g, n)) return false;
      if (libFilter === 'dupla' && !(min <= 2 && max >= 2)) return false;
      if (libFilter === 'grupo' && !(min >= 3)) return false;
      return true;
    });
    if (libSort === 'az') list = [...list].sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
    else if (libSort === 'jogadores') list = [...list].sort((a, b) => minOf(a) - minOf(b) || maxOf(a) - maxOf(b));

    const agora = daCat.filter(g => cabe(g, n));
    const row = q ? '' : `<section class="now">
        <div class="sec-head"><span class="tag">Cabem agora</span><span class="mono mut">PARA ${pessoas(n).toUpperCase()}</span></div>
        ${agora.length ? `<div class="now-row">${agora.map(g => gameCard(g, n, true)).join('')}</div>`
          : `<p class="sub mut">Nenhum jogo${libCat ? ' desta categoria' : ''} cabe com ${pessoas(n)}. Chame mais gente com o QR da sala.</p>`}
      </section>`;
    const chips = [['todos', 'Todos'], ['cabem', 'Cabem agora'], ['dupla', 'Dá para 2'], ['grupo', 'Só em grupo (3+)']];
    const sorts = [['padrao', 'Padrão'], ['az', 'A–Z'], ['jogadores', 'Nº de jogadores']];
    const catNome = libCat ? CATS.find(k => k[0] === libCat)[1] : '';
    return `${row}
      <section class="all">
        <div class="sec-head"><span class="tag">${libCat ? esc(catNome) : 'Todos os jogos'}</span><span class="mono mut lib-count">${list.length} ${list.length === 1 ? 'JOGO' : 'JOGOS'}</span></div>
        <div class="lib-chips">${chips.map(([k, label]) => `<button class="lib-chip mono ${libFilter === k ? 'sel' : ''}" data-a="lib-filtro" data-k="${k}">${esc(label)}</button>`).join('')}</div>
        <div class="lib-chips"><span class="mono mut lib-sort-l">ORDEM</span>${sorts.map(([k, label]) => `<button class="lib-chip mono ${libSort === k ? 'sel' : ''}" data-a="lib-sort" data-k="${k}">${esc(label)}</button>`).join('')}</div>
        ${list.length ? `<div class="shelf2">${list.map(g => gameCard(g, n)).join('')}</div>`
          : `<div class="box lib-empty"><p class="sub center mut">Nenhum jogo encontrado com esses filtros.</p><button class="btn" data-a="lib-limpar">Limpar busca e filtros</button></div>`}
      </section>`;
  }

  function detalhes(c, g) {
    const n = c.C.players.length, min = minOf(g), max = maxOf(g), k = catOf(g);
    const falta = Math.max(0, min - n), cheio = !g.spectators && n > max, podeComecar = !falta && !cheio;
    const regras = Array.isArray(g.howTo) ? g.howTo : [];
    const fit = cheio ? [`${n}/${max}`, `Este jogo aceita até ${max} jogadores. Tem ${n} na sala.`]
      : falta ? [`${n}/${min}`, `Faltam ${falta} ${falta === 1 ? 'jogador' : 'jogadores'} para começar.`]
      : g.spectators && n > max ? [`${max}/${n}`, `Os ${max} primeiros jogam. Quem sobra assiste e entra na próxima.`]
      : [`${n}/${max}`, n === max ? 'Todo mundo cabe. Dá para começar.' : `Todo mundo cabe. Dá para começar (até ${max}).`];
    const nome = g.name || '';
    // Título grande, mas a palavra mais comprida precisa caber inteira ao lado do cartão do glifo.
    const maior = Math.max.apply(null, nome.split(/\s+/).map(w => w.length));
    const tam = Math.max(22, Math.min(52, Math.floor((Math.min(window.innerWidth, 560) - 150) / maior), nome.length > 16 ? 32 : 52));
    return `${header(c, { detalhe: g })}
      <div class="hero dots" style="background-color:${k[2]}">
        <div class="hero-txt">
          <h1 class="disp" style="font-size:${tam}px">${esc(nome)}</h1>
          <div class="hero-tag mono"><span style="background:${k[2]}"></span>${esc(k[1].toUpperCase())} · ${min === max ? min : `${min} A ${max}`}</div>
        </div>
        <div class="hero-card"><span class="pix">${esc(g.glyph || '?')}</span><span class="pix flip">${esc(g.glyph || '?')}</span></div>
      </div>
      ${g.tagline ? `<p class="lead">${esc(g.tagline)}</p>` : ''}
      <div class="fit ${podeComecar ? '' : 'no'}"><span class="pix">${fit[0]}</span><span>${esc(fit[1])}</span></div>
      <div class="box rules">
        <h2 class="disp">Como funciona</h2>
        ${regras.length ? regras.map((r, i) => `<div class="rule"><span class="pix" style="background:${k[2]}">${pad2(i + 1)}</span><span>${esc(r)}</span></div>`).join('') : '<p class="sub">As regras aparecem quando o jogo começar.</p>'}
      </div>
      <button class="btn big warn start-btn" data-a="jogar" data-id="${esc(g.id)}" ${podeComecar ? '' : 'disabled'}>${ICO_PLAY}${podeComecar ? 'Iniciar' : falta ? `Faltam ${falta}` : 'Sala cheia'}</button>
      <button class="btn ghost" data-a="voltar-jogos">Voltar aos jogos</button>`;
  }

  let lastKey = null, activeView = null, lastScreen = null;
  function render(c) {
    ctx = c;
    const screen = c.C && c.C.screen;
    if (lastScreen === 'game' && screen === 'library') selectedGameId = null;
    lastScreen = screen;
    const nextView = c.S && c.C && c.you && screen === 'game' && A.games[c.C.gameId] ? A.games[c.C.gameId].phone : null;
    if (activeView !== nextView) {
      if (activeView && activeView.destroy) activeView.destroy();
      activeView = nextView;
      lastKey = null;
    }
    if (!c.S || !c.C) {              // sem sala ainda: só a tela de código
      lastKey = null;
      app.innerHTML = lobby(c);
      app.querySelectorAll('[data-a]').forEach(el => el.onclick = ev => { ev.stopPropagation(); act(el.dataset.a, el); });
      const code = $('#code'); code.focus(); code.onkeydown = ev => { if (ev.key === 'Enter') act('ir'); };
      return;
    }
    // Um jogo pode pedir para NÃO redesenhar a tela (ex.: quadro de desenho no meio do rabisco).
    // Se a chave for a mesma da última vez, só chama after() para atualizar por dentro.
    const implK = screen === 'game' ? A.games[c.C.gameId] : null;
    const key = implK && implK.phone && implK.phone.key ? c.C.screen + ':' + c.C.gameId + ':' + implK.phone.key(c) : null;
    if (key !== null && key === lastKey && c.you) { if (implK.phone.after) implK.phone.after(c); return; }
    lastKey = key;
    let h = '';
    if (!c.you) h = entrar(c);
    else if (c.C.screen === 'library') h = biblioteca(c);
    else {
      const impl = A.games[c.C.gameId];
      h = header(c) + (impl && impl.phone ? impl.phone.html(c) : '<div class="box center"><p class="sub">Carregando o jogo…</p></div>')
        + `<button class="btn exit-btn" data-a="voltar">Sair do jogo<small class="mono">VOLTA PARA A BIBLIOTECA</small></button>`;
    }
    // O innerHTML inteiro é trocado a cada estado do servidor. Se o campo de busca da biblioteca
    // estiver focado, guardamos o cursor antes de trocar o HTML e devolvemos o foco depois —
    // senão a pessoa digitaria uma letra e o teclado fecharia sozinho a cada atualização.
    // O mesmo vale para o nome no editor do boneco.
    const focoId = document.activeElement && ['lib-search', 'av-name'].includes(document.activeElement.id) ? document.activeElement.id : null;
    const focoSel = focoId ? [document.activeElement.selectionStart, document.activeElement.selectionEnd] : null;
    app.innerHTML = h;
    app.querySelectorAll('[data-a]').forEach(el => el.onclick = ev => { ev.stopPropagation(); act(el.dataset.a, el); });
    const n = $('#name'); if (n) n.oninput = () => { form.name = n.value; };
    const buscaEl = $('#lib-search');
    if (buscaEl) {
      buscaEl.oninput = () => {
        libSearch = buscaEl.value;
        const res = $('#lib-results'); if (!res) return;
        res.innerHTML = libResults(ctx);
        res.querySelectorAll('[data-a]').forEach(el => el.onclick = ev => { ev.stopPropagation(); act(el.dataset.a, el); });
      };
    }
    const avName = $('#av-name');
    if (avName) {
      avName.oninput = () => { nameDraft = avName.value; };
      avName.onkeydown = ev => { if (ev.key === 'Enter') { ev.preventDefault(); salvarNome(nameDraft); avName.blur(); } };
    }
    const focoEl = focoId && $('#' + focoId);
    if (focoEl) {
      focoEl.focus();
      if (focoSel) focoEl.setSelectionRange(focoSel[0], focoSel[1]);
    }
    const impl = c.C.screen === 'game' ? A.games[c.C.gameId] : null;
    if (impl && impl.phone && impl.phone.after) impl.phone.after(c);
  }

  // Troca o nome já dentro da sala (prompt do ✏️ ou campo do editor do boneco).
  function salvarNome(n) {
    n = String(n || '').trim().slice(0, 20);
    const me = ctx && ctx.you && ctx.C.players.find(p => p.pid === ctx.you.pid);
    if (!n || (me && me.name === n)) return;
    A.setPrev(form.name); form.name = n; A.saveForm(form); A.send({ t: 'rename', name: n });
  }

  function act(a, el) {
    const c = ctx;
    // ações da tela de entrada e da prateleira só valem lá; dentro de um jogo, o jogo é quem trata (evita colisão de nomes)
    const emJogo = c.S && c.you && c.C.screen === 'game';
    switch (emJogo && ['cor', 'entrar', 'detalhes', 'jogar', 'ir', 'criar', 'surpresa', 'lib-cat', 'perfil'].includes(a) ? '' : a) {
      case 'ir': { const v = ($('#code').value || '').trim().toUpperCase(); if (v.length !== 4) return A.toast('O código tem 4 letras.'); return A.goRoom(v); }
      case 'criar': return A.createRoom();
      // A câmera lê o QR da TV e o código de 4 letras sai do endereço. Trocamos só o código:
      // ficamos no mesmo endereço deste celular (mudar de endereço perderia o lugar guardado).
      case 'qr': {
        if (!window.QRSCAN) return A.toast('O leitor de QR não carregou. Digite o código.');
        return QRSCAN.open(code => { if (code === A.room) return A.toast('Você já está nesta sala.'); A.goRoom(code); });
      }
      case 'trocar': if (confirm('Ir para outra sala? Seu lugar nesta sala fica guardado.')) location.href = '/'; return;
      case 'cor': form.color = el.dataset.c; A.saveForm(form); render(c); return;
      case 'av-prev': return avatarStep(Number(el.dataset.i), -1);
      case 'av-next': return avatarStep(Number(el.dataset.i), 1);
      case 'av-rand': return avatarStep(-1, 0);
      case 'av-edit': {
        const me = c.you && c.C.players.find(p => p.pid === c.you.pid);
        if (editAv) salvarNome(nameDraft);
        else nameDraft = me ? me.name : form.name;
        editAv = !editAv; return render(c);
      }
      case 'entrar': {
        const before = A.form().name;
        if (before && before !== form.name) A.setPrev(before);
        A.saveForm(form);
        return A.send({ t: 'join', room: A.room, color: form.color, name: form.name, av: form.av, pid: A.identity(), prevName: localStorage.getItem('arcade_prev') || '', sid: A.sid() });
      }
      case 'rename': {
        const n = prompt('Seu nome:', c.you ? c.you.name : form.name);
        if (n && n.trim()) { salvarNome(n); if (editAv) { nameDraft = n.trim().slice(0, 20); render(c); } }
        return;
      }
      case 'sair': if (confirm('Sair da sala? Você perde seu lugar na ordem.')) { A.send({ t: 'leave' }); form.color = null; A.saveForm(form); } return;
      case 'kick': if (confirm(`Tirar "${el.dataset.name}" da sala? Só faça isso se esse celular não vai voltar.`)) A.send({ t: 'kick', pid: el.dataset.pid }); return;
      case 'lib-filtro': libFilter = el.dataset.k; saveLibPrefs(); return render(c);
      case 'lib-sort': libSort = el.dataset.k; saveLibPrefs(); return render(c);
      case 'lib-limpar': libSearch = ''; libFilter = 'todos'; libSort = 'padrao'; libCat = ''; saveLibPrefs(); return render(c);
      // Categoria: toque filtra a lista; tocar de novo na mesma limpa.
      case 'lib-cat': libCat = libCat === el.dataset.k ? '' : el.dataset.k; saveLibPrefs(); return render(c);
      // Surpresa: sorteia um jogo que cabe com quem está na sala e abre o detalhe dele.
      case 'surpresa': {
        const n = c.C.players.length, ok = c.meta.games.filter(g => cabe(g, n) && g.id !== selectedGameId);
        if (!ok.length) return A.toast(`Nenhum jogo cabe com ${pessoas(n)}. Chame mais gente.`);
        selectedGameId = ok[Math.floor(Math.random() * ok.length)].id; render(c); window.scrollTo(0, 0); return;
      }
      // Botão do boneco na barra do topo: abre o editor de boneco e nome e rola até ele.
      case 'perfil': {
        const me = c.you && c.C.players.find(p => p.pid === c.you.pid);
        if (!editAv) { nameDraft = me ? me.name : form.name; editAv = true; selectedGameId = null; render(c); }
        const box = $('#av-edit'); if (box) box.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      case 'ver-qr': verQR = !verQR; return render(c);
      case 'detalhes': selectedGameId = el.dataset.id; render(c); window.scrollTo(0, 0); return;
      case 'voltar-jogos': selectedGameId = null; return render(c);
      case 'jogar': return A.send({ t: 'play', id: el.dataset.id });
      case 'voltar': if (confirm('Sair do jogo e voltar para a biblioteca? A partida atual acaba.')) { selectedGameId = null; A.send({ t: 'quit' }); } return;
    }
    const impl = A.games[c.C.gameId];
    if (impl && impl.phone && impl.phone.act) impl.phone.act(a, el, c);
  }

  A.start('phone', render);
})();
</script>
